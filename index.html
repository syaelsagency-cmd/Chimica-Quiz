<!DOCTYPE html>

<style>
/* Layout: tavola di sezioni come caselle di tavola periodica; quiz e revisione in colonna stretta da lettura. */
:root{
  --bg:#f4f5f3; --surface:#ffffff; --sunken:#eceeeb; --ink:#232a2c; --muted:#6c7679; --line:#e2e5e2;
  --accent:#4a6781; --accent-ink:#ffffff; --accent-soft:#e8edf1;
  --ok:#3f7a5b; --ok-soft:#e7f1eb; --ko:#a5574c; --ko-soft:#f6e9e6; --warn:#86703e; --warn-soft:#f4efdf;
  --display:"Bricolage Grotesque","IBM Plex Sans",system-ui,"Segoe UI",sans-serif;
  --body:"IBM Plex Sans",system-ui,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,"Courier New",monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161a1b; --surface:#1e2425; --sunken:#121516; --ink:#e3e7e6; --muted:#98a3a5; --line:#2e3638;
  --accent:#9db4c9; --accent-ink:#141b21; --accent-soft:#27323b;
  --ok:#8cc3a4; --ok-soft:#1f3229; --ko:#dc9a90; --ko-soft:#3a2623; --warn:#cdb67e; --warn-soft:#342d1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161a1b; --surface:#1e2425; --sunken:#121516; --ink:#e3e7e6; --muted:#98a3a5; --line:#2e3638;
  --accent:#9db4c9; --accent-ink:#141b21; --accent-soft:#27323b;
  --ok:#8cc3a4; --ok-soft:#1f3229; --ko:#dc9a90; --ko-soft:#3a2623; --warn:#cdb67e; --warn-soft:#342d1a; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px 80px}
.narrow{max-width:720px;margin:0 auto}
header.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:28px 0 36px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:500;font-size:19px;letter-spacing:-.01em}
.brand i{width:12px;height:12px;border-radius:50%;border:3px solid var(--accent)}
nav.tabs{display:flex;gap:4px;margin-left:auto}
nav.tabs button{background:none;border:0;padding:8px 14px;border-radius:999px;color:var(--muted);font-weight:500}
nav.tabs button[aria-current="page"]{background:var(--sunken);color:var(--ink)}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:10px 20px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:none}
.btn[disabled]{opacity:.45;cursor:default}
.muted{color:var(--muted)} .small{font-size:14px} .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
/* riepilogo */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 32px;margin-bottom:48px}
.kpi{padding:0}
.kpi b{display:block;font:500 30px/1.2 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi span{font-size:13px;color:var(--muted)}
.sech{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 18px}
.sech h2{font-size:21px;font-weight:500;letter-spacing:-.01em}
/* caselle sezione */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:52px}
.tile{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 16px;display:flex;flex-direction:column;gap:4px;min-height:150px;transition:border-color .15s,box-shadow .15s}
.tile:hover{border-color:var(--accent);box-shadow:0 6px 18px -12px var(--accent)}

.tile .sym{font:500 38px/1 var(--display);color:var(--accent);letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-bottom:10px}
.tile .nm{font-weight:500;font-size:15.5px;line-height:1.3}
.tile .meta{font-size:13px;color:var(--muted);margin-top:auto;padding-top:10px}
.tile .bar{height:3px;border-radius:2px;background:var(--sunken);margin-top:8px;overflow:hidden}
.tile .bar i{display:block;height:100%;background:var(--accent)}
.tile.special{background:var(--sunken);border-color:transparent}
.tile.special .sym{color:var(--ink)}
.tile[disabled]{opacity:.5;cursor:default;transform:none}
@media (prefers-reduced-motion:reduce){.tile{transition:none}}
.seg{display:inline-flex;gap:2px;background:var(--sunken);border-radius:999px;padding:3px;margin:0 0 22px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:999px;padding:8px 14px;color:var(--muted);font-weight:500;font-size:14.5px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.lvl{font-size:13px;color:var(--muted)}
.login{max-width:380px;margin:12vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:34px 30px}
.login h1{font-size:24px;font-weight:500;letter-spacing:-.01em;margin:14px 0 6px}
.login p{margin:0 0 22px;color:var(--muted);font-size:15px}
.login label{display:block;font-size:13.5px;color:var(--muted);margin:14px 0 6px}
.login input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.login input:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.login .btn{width:100%;margin-top:22px;padding:12px}
.login .err{background:var(--ko-soft);color:var(--ko);border-radius:10px;padding:10px 12px;margin-top:16px;font-size:14.5px}
code{font-family:var(--mono);font-size:.92em;background:var(--sunken);padding:.12em .38em;border-radius:6px}
code.blk{display:block;white-space:pre;overflow-x:auto;padding:14px 16px;margin:12px 0 0;font-size:14.5px;line-height:1.55;font-weight:400;border-radius:10px}
.opt.sel code{background:var(--surface)}
.subj{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 40px}
.subj button{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:2px}
.subj button b{font:500 19px/1.2 var(--display);letter-spacing:-.01em}
.subj button span{font-size:13px;color:var(--muted)}
.subj button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.chat{display:flex;flex-direction:column;gap:12px;margin:18px 0}
.msg{max-width:88%;padding:12px 15px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5;font-size:15.5px}
.msg.user{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.ai code.blk{white-space:pre}
.msg.wait{color:var(--muted);font-style:italic}
.airow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.airow select,.airow input,.aibox textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.airow select{flex:1 1 200px;min-width:0}
.airow input{flex:1 1 220px;min-width:0}
.aibox{display:flex;gap:10px;align-items:flex-end;position:sticky;bottom:0;background:var(--bg);padding:10px 0 14px}
.aibox textarea{flex:1;min-width:0;resize:vertical;min-height:48px}
.aierr{background:var(--ko-soft);color:var(--ko);border-radius:10px;padding:12px 14px;font-size:14.5px}
.rev .askai{margin-top:12px;font-size:14px;padding:7px 14px}
/* quiz */
.qhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.qhead h2{font-size:18px;font-weight:500}
.clock{margin-left:auto;font:500 16px/1 var(--mono);font-variant-numeric:tabular-nums;color:var(--muted);padding:8px 0}
.clock.low{color:var(--ko);border-color:var(--ko)}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.dots button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:none;font:400 13px/1 var(--body);color:var(--muted)}
.dots button.done{background:var(--accent-soft);border-color:transparent;color:var(--ink)}
.dots button.cur{border:1.5px solid var(--accent);color:var(--ink);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:30px}
.card .tag{font-size:13px;color:var(--muted)}
.card h3{font:500 21px/1.4 var(--body);margin:8px 0 24px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 16px;width:100%}
.opt:hover{border-color:var(--muted)}
.opt .k{flex:none;width:24px;font:500 14px/24px var(--body);color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{color:var(--accent);font-weight:600}
.qfoot{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;align-items:center}
.qfoot .sp{margin-left:auto}
.confirm{background:var(--warn-soft);border-radius:var(--r);padding:16px 18px;margin-top:18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.confirm p{margin:0;flex:1 1 240px}
/* revisione */
.score{display:flex;gap:40px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:30px;margin-bottom:24px}
.score .big{font:500 60px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.score .big small{font-size:26px;color:var(--muted);font-weight:400}
.score dl{display:grid;grid-template-columns:auto auto;gap:2px 14px;margin:0;font-size:14.5px}
.score dt{color:var(--muted)} .score dd{margin:0;font-variant-numeric:tabular-nums}
.rev{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;margin-bottom:14px}

.rev .rh{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.pill{font:500 12.5px/1 var(--body);padding:5px 10px;border-radius:999px}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.ko{background:var(--ko-soft);color:var(--ko)} .pill.blank{background:var(--warn-soft);color:var(--warn)}
.rev h4{font:500 17px/1.45 var(--body);margin:12px 0 12px}
.ans{display:flex;gap:8px;align-items:baseline;padding:3px 0}
.ans .lb{flex:none;font-size:13.5px;width:118px;color:var(--muted)}
.ans.bad span:last-child{color:var(--ko);text-decoration:line-through}
.ans.good span:last-child{color:var(--ok);font-weight:500}
.corr{background:var(--sunken);border-radius:10px;padding:14px 16px;margin-top:14px;font-size:15px;line-height:1.55}
.corr b{font-weight:500;font-size:13px;display:block;margin-bottom:4px;color:var(--muted)}
details.why{margin-top:8px;font-size:15px} details.why summary{cursor:pointer;color:var(--muted);font-size:14px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 28px}
/* storico */
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:28px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{padding:13px 18px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:400;font-size:13px;color:var(--muted)}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted);margin-bottom:28px}
.note{font-size:13.5px;color:var(--muted);margin-top:8px}
@media (max-width:520px){.card{padding:16px}.card h3{font-size:18px}.score .big{font-size:44px}.ans{flex-direction:column;gap:0}.ans .lb{width:auto}.grid{grid-template-columns:repeat(2,1fr)}}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{touch-action:manipulation}
.login input{font-size:16px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
var BANK=[],GENS=[];function Q(t,q,o,e){BANK.push({t:t,q:q,o:o,e:e});}function G(t,id,fn){GENS.push({t:t,id:id,fn:fn});}
// Formato: Q(argomento, domanda, [GIUSTA, sbagliata, sbagliata, sbagliata, (sbagliata)], spiegazione)
// ---------- 1. Fondamenti e misure ----------
Q('fond','Quale delle seguenti è una proprietà intensiva?',['Densità','Massa','Volume','Energia','Quantità di sostanza'],'Le proprietà intensive non dipendono dalla quantità di campione. La densità è il rapporto tra due estensive (m/V) ed è intensiva.');
Q('fond','Quale di questi sistemi è una miscela omogenea?',['Aria','Latte','Sangue','Acqua e sabbia','Nebbia'],'Una miscela omogenea (soluzione) ha una sola fase. L\'aria è una soluzione gassosa; latte, sangue e nebbia sono dispersioni eterogenee.');
Q('fond','Come si chiama il passaggio diretto dallo stato gassoso allo stato solido?',['Brinamento','Sublimazione','Condensazione','Solidificazione'],'Gas → solido è il brinamento (o deposizione). La sublimazione è il passaggio inverso, solido → gas.');
Q('fond','A quanto corrisponde 1 atm?',['760 mmHg','76 mmHg','100 000 Pa','1 bar esatto','1013 Pa'],'1 atm = 101 325 Pa = 760 mmHg = 760 Torr. 1 bar vale 10⁵ Pa, quindi è poco meno di 1 atm.');
Q('fond','Quante cifre significative ha il numero 0,0046?',['2','3','4','5'],'Gli zeri a sinistra della prima cifra diversa da zero non contano: restano 4 e 6.');
Q('fond','Qual è il risultato di 3,0 × 7,34 con il corretto numero di cifre significative?',['22','22,0','22,02','22,020'],'In moltiplicazione il risultato ha tante cifre significative quante il fattore che ne ha meno: 3,0 ne ha 2.');
Q('fond','Qual è il risultato di 96,5 − 0,48 espresso correttamente?',['96,0','96,02','96','96,020'],'In somma e sottrazione ci si ferma al decimale del termine meno preciso: 96,5 ha un solo decimale.');
Q('fond','Un pH-metro non tarato produce un errore sempre dello stesso segno. Che cosa compromette?',['L\'accuratezza','La precisione','Il numero di cifre significative','La sensibilità','Nessuna delle altre risposte'],'Un errore sistematico allontana le misure dal valore vero, cioè riduce l\'accuratezza. La precisione dipende dagli errori casuali.');
Q('fond','Una serie di misure molto vicine tra loro ma lontane dal valore vero è:',['Precisa ma non accurata','Accurata ma non precisa','Accurata e precisa','Né accurata né precisa'],'Precisione = accordo tra misure ripetute; accuratezza = vicinanza al valore vero.');
Q('fond','Qual è l\'unità SI della quantità di sostanza?',['Mole','Grammo','Chilogrammo','Litro','Dalton'],'La mole (mol) è una delle sette unità fondamentali del SI.');
Q('fond','A quanti kelvin corrispondono 25 °C?',['298,15 K','248,15 K','273,15 K','25 K','77 K'],'T(K) = t(°C) + 273,15.');
Q('fond','Quale metodo separa due liquidi miscibili con diversa volatilità?',['Distillazione','Filtrazione','Decantazione','Imbuto separatore','Centrifugazione'],'La distillazione sfrutta la diversa volatilità. L\'imbuto separatore serve per liquidi immiscibili.');
Q('fond','Che cos\'è un\'emulsione?',['Un liquido disperso in un altro liquido non miscibile','Un solido insolubile disperso in un liquido','Un gas disciolto in un liquido','Una miscela omogenea di due liquidi','Un solido disperso in un gas'],'Latte e maionese sono emulsioni. Un solido disperso in un liquido che sedimenta è una sospensione.');
Q('fond','Quale di queste è una trasformazione chimica?',['Combustione del metano','Fusione del ghiaccio','Sublimazione dello iodio','Evaporazione dell\'alcol','Dissoluzione dello zucchero in acqua'],'Nella combustione si formano sostanze nuove (CO₂ e H₂O). Le altre sono trasformazioni fisiche.');
Q('fond','Qual è la differenza tra legge e teoria scientifica?',['La legge descrive cosa succede, la teoria spiega perché','La legge è provvisoria, la teoria è definitiva','La teoria descrive cosa succede, la legge spiega perché','La legge vale solo in laboratorio','Nessuna: sono sinonimi'],'La legge riassume un comportamento che si ripete; la teoria (modello) ne dà la spiegazione e resta valida finché non viene contraddetta.');
Q('fond','A quale potenza di 10 corrisponde il prefisso nano (n)?',['10⁻⁹','10⁻⁶','10⁻³','10⁻¹²','10⁹'],'m = 10⁻³, µ = 10⁻⁶, n = 10⁻⁹, p = 10⁻¹².');
Q('fond','A quale volume corrisponde 1 litro?',['1 dm³','1 cm³','1 m³','100 cm³'],'1 L = 1 dm³ = 1000 cm³; 1 mL = 1 cm³.');
Q('fond','Quale di questi elementi NON esiste come molecola biatomica in condizioni ordinarie?',['He','H₂','N₂','Cl₂','I₂'],'I gas nobili sono monoatomici. Biatomici: H₂, N₂, O₂, F₂, Cl₂, Br₂, I₂.');
Q('fond','Un oggetto galleggia su un liquido se:',['È meno denso del liquido','È più denso del liquido','Ha massa minore del liquido','Ha volume maggiore del liquido'],'Conta la densità, non la massa o il volume presi da soli.');
Q('fond','Come si separa un composto nei suoi elementi?',['Solo con metodi chimici','Per filtrazione','Per distillazione','Per centrifugazione','Per cromatografia'],'Le miscele si separano con metodi fisici; un composto ha rapporti fissi tra gli elementi e si scinde solo con reazioni chimiche.');
Q('fond','In una soluzione, il solvente è:',['Il componente più abbondante','Sempre l\'acqua','Il componente solido','Il componente con massa molare maggiore'],'Il componente più abbondante è il solvente, gli altri sono i soluti.');

// ---------- 2. Atomo e isotopi ----------
Q('atomo','Chi ha enunciato la legge di conservazione della massa?',['Lavoisier','Proust','Dalton','Avogadro','Boyle'],'Lavoisier: in una reazione la massa totale dei reagenti è uguale a quella dei prodotti.');
Q('atomo','La legge delle proporzioni definite (un composto ha sempre la stessa composizione in massa) è di:',['Proust','Lavoisier','Dalton','Gay-Lussac','Mendeleev'],'Proust: proporzioni definite. Dalton: proporzioni multiple.');
Q('atomo','Quale esperimento ha dimostrato l\'esistenza del nucleo atomico?',['La diffusione di particelle α su una lamina d\'oro (Rutherford)','I raggi catodici (Thomson)','La goccia d\'olio (Millikan)','L\'effetto fotoelettrico (Einstein)','Lo spettro dell\'idrogeno (Bohr)'],'Poche particelle α venivano deviate di grandi angoli: la carica positiva e la massa sono concentrate in un nucleo piccolissimo.');
Q('atomo','Chi ha scoperto l\'elettrone studiando i raggi catodici?',['Thomson','Rutherford','Chadwick','Millikan','Dalton'],'Thomson misurò il rapporto carica/massa dell\'elettrone.');
Q('atomo','Con quale esperimento Millikan ha misurato la carica dell\'elettrone?',['Goccia d\'olio','Lamina d\'oro','Tubo a raggi catodici','Diffrazione dei raggi X'],'Dalle goccioline d\'olio cariche sospese in un campo elettrico ricavò la carica elementare.');
Q('atomo','Chi ha scoperto il neutrone?',['Chadwick','Thomson','Rutherford','Bohr','Planck'],'Chadwick, nel 1932.');
Q('atomo','Due isotopi dello stesso elemento differiscono per:',['Il numero di neutroni','Il numero di protoni','Il numero di elettroni','Il numero atomico','La carica del nucleo'],'Stesso Z (protoni), diverso numero di massa A perché cambia il numero di neutroni.');
Q('atomo','Nel carbonio-14, il numero 14 indica:',['Il numero di massa (protoni + neutroni)','Il numero atomico','Il numero di neutroni','Il numero di elettroni','La massa molare media dell\'elemento'],'A = Z + N. Il ¹⁴C ha 6 protoni e 8 neutroni.');
Q('atomo','Che cosa identifica un elemento chimico?',['Il numero di protoni','Il numero di neutroni','Il numero di massa','Il numero di elettroni di valenza'],'Il numero atomico Z, cioè il numero di protoni nel nucleo.');
Q('atomo','Quanti neutroni ha il deuterio (²H)?',['1','0','2','3'],'A = 2, Z = 1, quindi N = 1. Il prozio ne ha 0, il trizio 2.');

Q('legame','Quale di queste specie NON è descritta da un ibrido di risonanza?',['CH₄','O₃','C₆H₆','CO₃²⁻','NO₃⁻'],'Il metano ha solo legami singoli localizzati.');

Q('legame','Come varia la conducibilità elettrica all\'aumentare della temperatura?',['Diminuisce nei metalli e aumenta nei semiconduttori','Aumenta in entrambi','Diminuisce in entrambi','Aumenta nei metalli e diminuisce nei semiconduttori'],'Nei metalli crescono le vibrazioni del reticolo; nei semiconduttori più elettroni superano la banda proibita.');
Q('legame','Che cosa distingue un isolante da un semiconduttore nel modello a bande?',['L\'isolante ha una banda proibita molto più grande','L\'isolante non ha banda di valenza','Il semiconduttore ha bande sovrapposte','L\'isolante ha la banda di conduzione semipiena'],'Diamante circa 5,5 eV contro 1,1 eV del silicio.');

Q('legame','Quale composto ha l\'energia reticolare maggiore?',['MgO','NaCl','KBr','NaF','CsI'],'Ioni con carica doppia e raggio piccolo: l\'attrazione elettrostatica è molto più forte.');

Q('termo','Per una stessa sostanza, l\'entalpia di sublimazione è uguale a:',['ΔH di fusione + ΔH di vaporizzazione','ΔH di vaporizzazione − ΔH di fusione','ΔH di fusione','Il doppio del ΔH di vaporizzazione'],'Legge di Hess: solido → liquido → gas dà lo stesso risultato di solido → gas.');

Q('termo','L\'energia di legame è sempre positiva perché:',['Rompere un legame richiede energia','Formare un legame richiede energia','I legami sono sempre ionici','È definita a 0 K'],'La stessa quantità viene liberata quando il legame si forma.');

Q('equil','Per aumentare la quantità di CO₂ nell\'equilibrio MgCO₃(s) ⇌ MgO(s) + CO₂(g) si deve:',['Aumentare il volume del recipiente','Aggiungere MgO','Aggiungere N₂ a volume costante','Aumentare la pressione','Togliere un po\' di MgCO₃'],'A T costante la pressione di CO₂ all\'equilibrio è fissa: in un volume maggiore servono più moli. I solidi non contano.');
Q('equil','A 1000 K, per una reazione con Δn = 1, la relazione tra Kp e Kc è:',['Kp = 82 Kc','Kp = Kc / 82','Kp = Kc','Kp = 82² Kc'],'Kp = Kc (RT)^Δn con RT = 0,082 × 1000 = 82.');

Q('equil','Quali specie NON compaiono nell\'espressione della costante di equilibrio?',['Solidi e liquidi puri','Gas','Ioni in soluzione','Prodotti'],'La loro attività è unitaria: la concentrazione di un solido puro non cambia.');
Q('equil','Una reazione esotermica ha 5 moli di gas nei reagenti e 4 nei prodotti. Che cosa aumenta la concentrazione dei prodotti?',['Aumento della pressione','Aumento del volume','Aumento della temperatura','Aggiunta di un catalizzatore'],'Comprimendo, il sistema va verso il lato con meno moli di gas.');
Q('equil','Per H₂(g) + I₂(g) ⇌ 2 HI(g), un aumento della pressione totale per compressione:',['Non sposta l\'equilibrio','Sposta l\'equilibrio verso destra','Sposta l\'equilibrio verso sinistra','Fa aumentare K'],'Le moli di gas sono due da entrambe le parti.');
Q('equil','Come varia K di una reazione endotermica se la temperatura aumenta?',['Aumenta','Diminuisce','Resta costante','Si annulla'],'Il calore è come un reagente: scaldando si favoriscono i prodotti.');

Q('equil','Una costante di equilibrio K molto maggiore di 1 indica che all\'equilibrio:',['Prevalgono i prodotti','Prevalgono i reagenti','La reazione è veloce','La reazione è endotermica'],'K non dice nulla sulla velocità.');

Q('termo','Un sistema che scambia energia ma non materia con l\'ambiente è:',['Chiuso','Aperto','Isolato','Adiabatico'],'Aperto: scambia entrambe. Isolato: nessuna delle due.');

// Esercizi con numeri generati a caso: ogni volta che escono hanno dati diversi.
const ri = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = a => a[ri(0, a.length - 1)];
const mix = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = ri(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const num = (x, d = 3) => String(Number(Number(x).toFixed(d))).replace('.', ',').replace('-', '−');
const SUP = { '-': '⁻', 0: '⁰', 1: '¹', 2: '²', 3: '³', 4: '⁴', 5: '⁵', 6: '⁶', 7: '⁷', 8: '⁸', 9: '⁹' };
const sup = n => String(n).split('').map(c => SUP[c]).join('');
const p10 = n => '10' + sup(n);
// Costruisce le opzioni: giusta + sbagliate distinte (stringhe)
function opts(ok, cands, n = 3) {
  const out = [ok];
  for (const c of cands) { if (out.length > n) break; if (c != null && !out.includes(c)) out.push(c); }
  return out;
}
function optsNum(c, cands, unit = '', n = 3, d = 3) {
  const f = v => num(v, d) + unit;
  const extra = [c * 2, c / 2, c * 3, c / 4, c * 10, c / 10, c + 1];
  return opts(f(c), cands.concat(extra).filter(v => isFinite(v)).map(f), n);
}

  return { q: `Un recipiente indeformabile contiene un gas ideale a 1 atm e ${num(t)} °C. Se la pressione viene portata a 2 atm, la temperatura diventa:`,
    o: opts(`${T2 - 273} °C`, [`${T2 - 273} K`, `${t === 0 ? 2 : num(2 * t)} °C`, `${t + 273} °C`, `${num((t + 273) / 2)} K`], 4),
    e: `A volume costante p/T è costante, con T in kelvin: T₂ = 2 × ${t + 273} K = ${T2} K, cioè ${T2 - 273} °C. Raddoppiare i gradi Celsius è l'errore tipico.` };
});
const GASM = [['O₂', 32], ['N₂', 28], ['CO₂', 44], ['CH₄', 16], ['He', 4], ['H₂', 2], ['Ne', 20]];
G('gas', 'volume-tpn', () => {
  const [g, M] = pick(GASM), n = pick([0.25, 0.5, 1.5, 2, 3]);
  return { q: `Quanti litri occupano ${num(n * M)} g di ${g} a 0 °C e 1 atm? (massa molare ${M} g/mol)`,
    o: optsNum(22.4 * n, [22.4, 22.4 * n * M / 10, 22.4 / n, 24.5 * n], ' L', 4),
    e: `${num(n * M)} g sono ${num(n)} mol; in condizioni normali una mole occupa 22,4 L: ${num(n)} × 22,4 = ${num(22.4 * n)} L.` };
});
G('gas', 'dalton', () => {
  const tot = pick([4, 5, 10]), a = ri(1, tot - 1), k = pick([1, 2, 4]), P = tot * k / 2, pa = a * k / 2;
  return { q: `Una miscela contiene ${a} mol di He e ${tot - a} mol di Ne alla pressione totale di ${num(P)} atm. Qual è la pressione parziale dell'elio?`,
    o: optsNum(pa, [(tot - a) * k / 2, P, P / 2, a], ' atm', 4),
    e: `p(He) = x(He) · P = ${a}/${tot} × ${num(P)} = ${num(pa)} atm.` };
});
G('gas', 'graham', () => {
  const [a, Ma, b, Mb, r] = pick([['H₂', 2, 'O₂', 32, 4], ['He', 4, 'CH₄', 16, 2], ['H₂', 2, 'CH₄', 16, 2.828], ['He', 4, 'SO₂', 64, 4], ['CH₄', 16, 'SO₂', 64, 2], ['H₂', 2, 'He', 4, 1.414]]);
  return { q: `A parità di condizioni, quante volte più velocemente effonde ${a} (M = ${Ma}) rispetto a ${b} (M = ${Mb})?`,
    o: optsNum(r, [Mb / Ma, r * 2, r / 2, Mb - Ma], ' volte', 4, 2),
    e: `Legge di Graham: v(${a}) / v(${b}) = √(${Mb}/${Ma}) = ${num(r, 2)}.` };
});

G('liquidi', 'endo-eso', () => {
  const endo = ['Fusione', 'Evaporazione', 'Sublimazione', 'Ebollizione'], eso = ['Condensazione', 'Solidificazione', 'Brinamento'];
  const cercoEndo = Math.random() < 0.5, ok = pick(cercoEndo ? endo : eso), altri = mix(cercoEndo ? eso : endo).slice(0, 3);
  return { q: `Quale di questi passaggi di stato è ${cercoEndo ? 'endotermico' : 'esotermico'}?`, o: opts(ok, altri, 3),
    e: 'Fusione, evaporazione e sublimazione assorbono calore (si rompono interazioni); solidificazione, condensazione e brinamento lo cedono.' };
});
G('liquidi', 'calore-passaggio', () => {
  const n = pick([0.5, 2, 3, 5, 10]), fus = Math.random() < 0.5, dH = fus ? 6.01 : 40.7;
  return { q: `Quanto calore serve per ${fus ? 'fondere' : 'vaporizzare'} ${num(n)} mol di ${fus ? 'ghiaccio a 0 °C' : 'acqua a 100 °C'}? (ΔH = ${num(dH)} kJ/mol)`,
    o: optsNum(n * dH, [dH / n, dH, n * (fus ? 40.7 : 6.01), n * dH * 18], ' kJ', 4, 2),
    e: `Durante un passaggio di stato q = n · ΔH = ${num(n)} × ${num(dH)} = ${num(n * dH, 2)} kJ, a temperatura costante.` };
});

const SOL = [['NaOH', 40], ['NaCl', 58.5], ['KOH', 56], ['HCl', 36.5], ['glucosio', 180]];
G('soluz', 'molarita', () => {
  const [s, M] = pick(SOL), n = pick([0.1, 0.2, 0.25, 0.5, 1]), V = pick([250, 500, 1000, 2000]), C = n / (V / 1000);
  return { q: `Si sciolgono ${num(n * M)} g di ${s} (massa molare ${num(M)} g/mol) fino a ottenere ${V} mL di soluzione. Qual è la molarità?`,
    o: optsNum(C, [n * V / 1000, n * M / V, C * 2, C / 2], ' M', 4),
    e: `n = ${num(n * M)} / ${num(M)} = ${num(n)} mol; M = n / V = ${num(n)} / ${num(V / 1000)} L = ${num(C)} mol/L.` };
});
G('soluz', 'diluizione', () => {
  const C1 = pick([1, 2, 4, 6, 12]), V1 = pick([50, 100, 250, 500]), f = pick([2, 4, 5, 10]);
  return Math.random() < 0.5
    ? { q: `${V1} mL di soluzione ${C1} M vengono diluiti fino a ${V1 * f} mL. Qual è la nuova concentrazione?`, o: optsNum(C1 / f, [C1 * f, C1, C1 / (f - 1), C1 / f / 2], ' M', 4), e: `M₁V₁ = M₂V₂ → M₂ = ${C1} × ${V1} / ${V1 * f} = ${num(C1 / f)} M.` }
    : { q: `Quanta acqua bisogna aggiungere a ${V1} mL di soluzione ${C1} M per portarla a ${num(C1 / f)} M?`, o: optsNum(V1 * (f - 1), [V1 * f, V1, V1 / f, V1 * (f + 1)], ' mL', 4), e: `Il volume finale deve essere ${V1} × ${f} = ${V1 * f} mL: si aggiungono ${V1 * f} − ${V1} = ${V1 * (f - 1)} mL.` };
});
G('soluz', 'crioscopia', () => {
  const [s, i] = pick([['glucosio', 1], ['NaCl', 2], ['CaCl₂', 3], ['saccarosio', 1], ['KBr', 2]]), m = pick([0.1, 0.5, 1, 2]), dT = 1.86 * m * i;
  return { q: `A quale temperatura congela una soluzione acquosa ${num(m)} m di ${s}? (Kcr = 1,86 °C·kg/mol, dissociazione completa)`,
    o: opts(`−${num(dT, 2)} °C`, [`+${num(dT, 2)} °C`, `−${num(1.86 * m * (i === 1 ? 2 : 1), 2)} °C`, `−${num(1.86 * m * (i === 3 ? 2 : 3), 2)} °C`, '0 °C', `−${num(0.512 * m * i, 2)} °C`], 4),
    e: `ΔT = i · Kcr · m = ${i} × 1,86 × ${num(m)} = ${num(dT, 2)} °C. L'acqua pura congela a 0 °C, quindi la soluzione a −${num(dT, 2)} °C.` };
});
G('soluz', 'frazione-molare', () => {
  const tot = pick([2, 4, 5, 10]), a = pick([0.2, 0.25, 0.4, 0.5, 0.1].map(x => x * tot).filter(x => x > 0)), b = tot - a;
  return { q: `Una soluzione contiene ${num(a)} mol di soluto e ${num(b)} mol di solvente. Qual è la frazione molare del soluto?`,
    o: optsNum(a / tot, [a / b, b / tot, a, 1 / tot], '', 4),
    e: `x = n(soluto) / n(totali) = ${num(a)} / ${num(tot)} = ${num(a / tot)}.` };
});
G('soluz', 'vant-hoff', () => {
  const [s, i, d] = pick([['NaCl', 2, 'Na⁺ + Cl⁻'], ['CaCl₂', 3, 'Ca²⁺ + 2 Cl⁻'], ['Al₂(SO₄)₃', 5, '2 Al³⁺ + 3 SO₄²⁻'], ['K₂SO₄', 3, '2 K⁺ + SO₄²⁻'], ['Na₃PO₄', 4, '3 Na⁺ + PO₄³⁻'], ['MgCl₂', 3, 'Mg²⁺ + 2 Cl⁻'], ['KNO₃', 2, 'K⁺ + NO₃⁻'], ['Fe(NO₃)₃', 4, 'Fe³⁺ + 3 NO₃⁻'], ['Mg(CH₃COO)₂', 3, 'Mg²⁺ + 2 CH₃COO⁻'], ['AlCl₃', 4, 'Al³⁺ + 3 Cl⁻']]);
  return { q: `Quanto vale il coefficiente di van't Hoff di ${s}, considerandolo completamente dissociato?`, o: opts(String(i), mix(['1', '2', '3', '4', '5', '6']), 4),
    e: `${s} → ${d}: ${i} ioni per unità di soluto, quindi i = ${i}.` };
});
G('soluz', 'osmotica', () => {
  const M = pick([0.01, 0.05, 0.1, 0.2, 0.5]), [s, i] = pick([['glucosio', 1], ['NaCl', 2], ['saccarosio', 1], ['CaCl₂', 3]]), T = pick([273, 298, 300, 310]), pi = i * M * 0.0821 * T;
  return { q: `Qual è la pressione osmotica di una soluzione ${num(M)} M di ${s} a ${T} K? (R = 0,0821 L·atm/(mol·K), dissociazione completa)`,
    o: optsNum(pi, [pi / i * (i === 1 ? 2 : 1), M * 0.0821 * (T - 273 || 25) * i, pi * 10, M * 8.314 * T * i], ' atm', 4, 2),
    e: `π = i·M·R·T = ${i} × ${num(M)} × 0,0821 × ${T} = ${num(pi, 2)} atm.` };
});

const CELLE = [['cubica semplice', 1, 6, '52%'], ['cubica a corpo centrato', 2, 8, '68%'], ['cubica a facce centrate', 4, 12, '74%']];
G('solidi', 'celle-cubiche', () => {
  const c = pick(CELLE), k = ri(1, 3), altri = CELLE.filter(x => x !== c).map(x => String(x[k]));
  const dom = [null, 'Quanti atomi appartengono alla cella', 'Qual è il numero di coordinazione nella cella', 'Qual è l\'efficienza di impaccamento della cella'][k];
  const extra = [null, ['8', '9', '14'], ['4', '2'], ['100%', '34%']][k];
  return { q: `${dom} ${c[0]}?`, o: opts(String(c[k]), altri.concat(mix(extra)), 3),
    e: 'Cubica semplice: 1 atomo, N.C. 6, 52%. Corpo centrato: 2 atomi, N.C. 8, 68%. Facce centrate: 4 atomi, N.C. 12, 74%.' };
});
G('solidi', 'tipo-solido', () => {
  const [s, t] = pick([['Diamante', 'Covalente reticolare'], ['Quarzo (SiO₂)', 'Covalente reticolare'], ['Ghiaccio', 'Molecolare'], ['CO₂ solida', 'Molecolare'], ['Iodio I₂', 'Molecolare'], ['NaCl', 'Ionico'], ['MgO', 'Ionico'], ['CaF₂', 'Ionico'], ['Rame', 'Metallico'], ['Ferro', 'Metallico'], ['Argon solido', 'Atomico'], ['Zucchero', 'Molecolare'], ['Carburo di silicio SiC', 'Covalente reticolare']]);
  return { q: `Che tipo di solido cristallino è: ${s}?`, o: opts(t, mix(['Covalente reticolare', 'Molecolare', 'Ionico', 'Metallico', 'Atomico']), 4),
    e: 'Atomico: gas nobili. Molecolare: molecole tenute da forze intermolecolari. Ionico: cationi e anioni. Metallico: cationi in un mare di elettroni. Covalente reticolare: rete continua di legami covalenti.' };
});
G('solidi', 'bragg', () => {
  const [th, s] = pick([[30, 0.5], [14.5, 0.25]]), lam = pick([0.1, 0.154, 0.2, 0.071]), d = lam / (2 * s);
  return { q: `Raggi X con λ = ${num(lam)} nm danno la riflessione del primo ordine a θ = ${th}°. Qual è la distanza tra i piani reticolari? (sin ${th}° = ${num(s)})`,
    o: optsNum(d, [lam * s, lam, 2 * lam * s === lam ? lam * 4 : 2 * lam * s, lam / s === d ? lam * 3 : lam / s], ' nm', 4, 4),
    e: `Bragg: nλ = 2d·sinθ → d = λ / (2 sinθ) = ${num(lam)} / (2 × ${num(s)}) = ${num(d, 4)} nm.` };
});

G('cinet', 'emivita', () => {
  const h = pick([5, 10, 20, 30, 12]), k = ri(2, 5), u = pick(['min', 's', 'anni', 'ore']);
  return { q: `Una reazione del primo ordine ha tempo di dimezzamento di ${h} ${u}. Quale frazione del reagente resta dopo ${h * k} ${u}?`,
    o: opts(`1/${2 ** k}`, mix([1, 2, 3, 4, 5, 6].filter(x => x !== k).map(x => `1/${2 ** x}`)).concat([`1/${k}`]), 4),
    e: `${h * k} ${u} sono ${k} tempi di dimezzamento: resta (½)^${k} = 1/${2 ** k}.` };
});
G('cinet', 'ordine', () => {
  const m = pick([2, 3]), x = ri(0, m === 2 ? 3 : 2), f = m ** x, molt = m === 2 ? 'raddoppia' : 'triplica';
  return { q: `Quando la concentrazione di A ${molt}, la velocità ${f === 1 ? 'non cambia' : 'diventa ' + f + ' volte maggiore'}. Qual è l'ordine di reazione rispetto ad A?`,
    o: opts(String(x), mix(['0', '1', '2', '3'].filter(v => v !== String(x))).concat(f > 3 ? [String(f)] : ['4']), 4),
    e: `${m}ˣ = ${f} → x = ${x}.` };
});
G('cinet', 'costante-k', () => {
  const A = pick([0.1, 0.2, 0.5]), B = pick([0.1, 0.2]), k = pick([0.5, 2, 4, 10]), v = k * A * A * B;
  return { q: `Per una reazione con legge cinetica v = k[A]²[B], quanto vale la velocità se k = ${num(k)} M⁻²·s⁻¹, [A] = ${num(A)} M e [B] = ${num(B)} M?`,
    o: optsNum(v, [k * A * B, k * A * B * B, k * A * A, k * (A + A + B)], ' M/s', 4, 5),
    e: `v = ${num(k)} × (${num(A)})² × ${num(B)} = ${num(v, 5)} M/s.` };
});

G('termo', 'calore-acqua', () => {
  const m = pick([50, 100, 200, 250, 500]), dT = pick([10, 20, 25, 40, 50]), q = m * 4.18 * dT / 1000;
  return { q: `Quanto calore serve per scaldare ${m} g di acqua di ${dT} °C? (calore specifico 4,18 J/(g·°C))`,
    o: optsNum(q, [m * dT / 1000, q * 10, q / 4.18 / 4.18, m * 4.18 / 1000], ' kJ', 4, 2),
    e: `q = m · c · ΔT = ${m} × 4,18 × ${dT} = ${num(m * 4.18 * dT, 0)} J = ${num(q, 2)} kJ.` };
});
G('termo', 'temperatura-spontanea', () => {
  const T = pick([100, 250, 300, 400, 500, 800]), s = pick([50, 100, 200]), h = T * s / 1000, pos = Math.random() < 0.6;
  return { q: `Una reazione ha ΔH = ${pos ? '+' : '−'}${num(h)} kJ e ΔS = ${pos ? '+' : '−'}${s} J/K. A quali temperature è spontanea?`,
    o: opts(`${pos ? 'Sopra' : 'Sotto'} ${T} K`, [`${pos ? 'Sotto' : 'Sopra'} ${T} K`, 'A qualsiasi temperatura', 'A nessuna temperatura', `${pos ? 'Sopra' : 'Sotto'} ${num(h / s, 4)} K`], 4),
    e: `ΔG = ΔH − TΔS si annulla a T = ΔH / ΔS = ${num(h * 1000)} J / ${s} J/K = ${T} K (attenzione a kJ e J). ${pos ? 'Con ΔH e ΔS positivi la reazione è spontanea sopra questa temperatura.' : 'Con ΔH e ΔS negativi la reazione è spontanea sotto questa temperatura.'}` };
});
G('termo', 'delta-g', () => {
  let h, s, T, g; do { h = pick([-100, -50, 40, 80, -20]); s = pick([-100, 100, 200, -50]); T = pick([200, 300, 400, 500]); g = h - T * s / 1000; } while (g === 0);
  return { q: `Quanto vale ΔG a ${T} K per una reazione con ΔH = ${num(h)} kJ e ΔS = ${num(s)} J/K?`,
    o: optsNum(g, [h + T * s / 1000, -T * s / 1000, h - s / 1000 * (T - 273), -g], ' kJ', 4, 1),
    e: `ΔG = ΔH − TΔS = ${num(h)} − ${T} × (${num(s / 1000)}) = ${num(g, 1)} kJ: la reazione ${g < 0 ? 'è' : 'non è'} spontanea a questa temperatura.` };
});
G('termo', 'hess-formazione', () => {
  const [r, v, expl] = pick([
    ['CH₄ + 2 O₂ → CO₂ + 2 H₂O(l)   [ΔH°f: CH₄ −75, CO₂ −394, H₂O(l) −286 kJ/mol]', -394 + 2 * -286 + 75, '(−394) + 2(−286) − (−75)'],
    ['CaCO₃ → CaO + CO₂   [ΔH°f: CaCO₃ −1207, CaO −635, CO₂ −394 kJ/mol]', -635 - 394 + 1207, '(−635) + (−394) − (−1207)'],
    ['2 CO + O₂ → 2 CO₂   [ΔH°f: CO −111, CO₂ −394 kJ/mol]', 2 * -394 + 2 * 111, '2(−394) − 2(−111)'],
    ['N₂ + 3 H₂ → 2 NH₃   [ΔH°f: NH₃ −46 kJ/mol]', -92, '2(−46) − 0'],
    ['2 H₂ + O₂ → 2 H₂O(l)   [ΔH°f: H₂O(l) −286 kJ/mol]', -572, '2(−286) − 0']]);
  return { q: `Calcola il ΔH° della reazione: ${r}`, o: optsNum(v, [-v, v / 2, v * 2, v + 100, v - 286], ' kJ', 4, 0),
    e: `ΔH° = Σ ΔH°f(prodotti) − Σ ΔH°f(reagenti) = ${expl} = ${num(v, 0)} kJ. Gli elementi nel loro stato standard valgono zero.` };
});

G('equil', 'kc', () => {
  const a = pick([0.5, 1, 2, 4]), b = pick([0.2, 0.5, 1, 2, 4]), K = b * b / a;
  return { q: `Per N₂O₄(g) ⇌ 2 NO₂(g) all'equilibrio si misurano [N₂O₄] = ${num(a)} M e [NO₂] = ${num(b)} M. Quanto vale Kc?`,
    o: optsNum(K, [b / a, a / (b * b), 2 * b / a, b * b * a], '', 4, 4),
    e: `Kc = [NO₂]² / [N₂O₄] = (${num(b)})² / ${num(a)} = ${num(K, 4)}.` };
});
G('equil', 'q-k', () => {
  const K = pick([0.5, 10, 100, 0.02]), su = Math.random() < 0.5, Q = su ? K * pick([10, 100]) : K / pick([10, 100]);
  return { q: `Una reazione ha K = ${num(K, 5)}. In un certo istante il quoziente di reazione vale Q = ${num(Q, 5)}. In che verso procede la reazione?`,
    o: opts(su ? 'Verso i reagenti' : 'Verso i prodotti', [su ? 'Verso i prodotti' : 'Verso i reagenti', 'È già all\'equilibrio', 'Non si può prevedere senza conoscere la pressione'], 3),
    e: su ? 'Q > K: ci sono troppi prodotti, la reazione torna verso i reagenti finché Q = K.' : 'Q < K: ci sono pochi prodotti, la reazione procede verso destra finché Q = K.' };
});
const LC = [['N₂(g) + 3 H₂(g) ⇌ 2 NH₃(g)', 'esotermica', -2], ['2 SO₂(g) + O₂(g) ⇌ 2 SO₃(g)', 'esotermica', -1], ['N₂O₄(g) ⇌ 2 NO₂(g)', 'endotermica', 1], ['PCl₅(g) ⇌ PCl₃(g) + Cl₂(g)', 'endotermica', 1], ['H₂(g) + I₂(g) ⇌ 2 HI(g)', 'esotermica', 0], ['CO(g) + 2 H₂(g) ⇌ CH₃OH(g)', 'esotermica', -2]];
G('equil', 'le-chatelier', () => {
  const [r, t, dn] = pick(LC), eso = t === 'esotermica';
  const P = pick([['si aumenta la temperatura', eso ? -1 : 1, `La reazione è ${t}: scaldando si favorisce il verso che assorbe calore.`],
    ['si abbassa la temperatura', eso ? 1 : -1, `La reazione è ${t}: raffreddando si favorisce il verso che produce calore.`],
    ['si aumenta la pressione comprimendo', dn < 0 ? 1 : dn > 0 ? -1 : 0, dn === 0 ? 'Le moli di gas sono uguali ai due lati: la pressione non ha effetto.' : 'Comprimendo si favorisce il lato con meno moli di gas.'],
    ['si aumenta il volume del recipiente', dn < 0 ? -1 : dn > 0 ? 1 : 0, dn === 0 ? 'Le moli di gas sono uguali ai due lati: il volume non ha effetto.' : 'Espandendo si favorisce il lato con più moli di gas.'],
    ['si aggiunge un catalizzatore', 0, 'Il catalizzatore accelera allo stesso modo reazione diretta e inversa: l\'equilibrio non si sposta.'],
    ['si aggiunge altro reagente', 1, 'Il sistema consuma parte del reagente aggiunto formando prodotti.'],
    ['si sottrae prodotto', 1, 'Il sistema reagisce riformando il prodotto tolto.']]);
  const N = { 1: 'Verso destra (prodotti)', '-1': 'Verso sinistra (reagenti)', 0: 'Non si sposta' };
  return { q: `${r} è una reazione ${t} all'equilibrio. Come si sposta l'equilibrio se ${P[0]}?`,
    o: opts(N[P[1]], [N[1], N[-1], N[0], 'Non si può prevedere'], 3), e: 'Principio di Le Châtelier. ' + P[2] };
});

G('acidi', 'ph-acido-forte', () => {
  const n = ri(1, 5), a = pick(['HCl', 'HNO₃', 'HBr', 'HClO₄']);
  return { q: `Qual è il pH di una soluzione ${p10(-n)} M di ${a}?`, o: optsNum(n, [14 - n, n + 1, -n, n * 2 === 14 - n ? n + 2 : n * 2], '', 4),
    e: `${a} è un acido forte, completamente dissociato: [H₃O⁺] = ${p10(-n)} M, pH = −log[H₃O⁺] = ${n}.` };
});
G('acidi', 'ph-base-forte', () => {
  const n = ri(1, 5), b = pick(['NaOH', 'KOH']);
  return { q: `Qual è il pH di una soluzione ${p10(-n)} M di ${b}?`, o: optsNum(14 - n, [n, 14 + n, 7, 13 - n === n ? 14 : 13 - n], '', 4),

});
G('acidi', 'oh-da-ph', () => {
  const ph = pick([2, 3, 4, 5, 9, 10, 11, 12]);
  return { q: `Una soluzione ha pH = ${ph} a 25 °C. Quanto vale [OH⁻]?`,
    o: opts(`${p10(ph - 14)} M`, [`${p10(-ph)} M`, `${p10(14 - ph)} M`, `${p10(ph)} M`, `${p10(-7)} M`], 4),
    e: `pOH = 14 − ${ph} = ${14 - ph}, quindi [OH⁻] = ${p10(ph - 14)} M.` };
});
G('acidi', 'titolazione', () => {
  const Va = pick([10, 20, 25, 50]), Ca = pick([0.1, 0.2, 0.5]), Cb = pick([0.1, 0.2, 0.25, 0.5]), dip = Math.random() < 0.35, Vb = Va * Ca * (dip ? 2 : 1) / Cb;
  return { q: `Quanti mL di NaOH ${num(Cb)} M servono per neutralizzare ${Va} mL di ${dip ? 'H₂SO₄' : 'HCl'} ${num(Ca)} M?`,
    o: optsNum(Vb, [dip ? Vb / 2 : Vb * 2, Va, Va * Cb / Ca, Vb / 4], ' mL', 4),
    e: dip ? `H₂SO₄ è diprotico: servono 2 mol di NaOH per mole di acido. V = 2 × ${Va} × ${num(Ca)} / ${num(Cb)} = ${num(Vb)} mL.` : `Moli di acido = moli di base: V = ${Va} × ${num(Ca)} / ${num(Cb)} = ${num(Vb)} mL.` };

// Rappresentazione "alla Python" dei valori
function py(v) {
  if (v === null || v === undefined) return 'None';
  if (v === true) return 'True';
  if (v === false) return 'False';
  if (typeof v === 'string') return "'" + v + "'";
  if (v && v.tup) return '(' + v.tup.map(py).join(', ') + (v.tup.length === 1 ? ',' : '') + ')';
  if (Array.isArray(v)) return '[' + v.map(py).join(', ') + ']';
  if (v && v.f !== undefined) return Number.isInteger(v.f) ? v.f + '.0' : String(v.f);
  return String(v);
}
const C = s => '`' + s + '`';
const bin = (n, bits) => { let s = n.toString(2); while (s.length < bits) s = '0' + s; return s; };
const uniq = a => a.filter((x, i) => a.indexOf(x) === i);
// opzioni da valori Python: giusta + sbagliate distinte, già formattate come codice
function po(ok, cands, n = 3) { return opts(C(py(ok)), uniq(cands.map(v => C(py(v)))), n); }
const slice = (s, a, b, st = 1) => { // slice Python su stringa o array
  const n = s.length, arr = typeof s === 'string' ? s.split('') : s.slice(), out = [];
  const norm = (x, d) => x === null ? d : (x < 0 ? Math.max(st > 0 ? 0 : -1, x + n) : Math.min(st > 0 ? n : n - 1, x));
  if (st > 0) { for (let i = norm(a, 0); i < norm(b, n); i += st) out.push(arr[i]); }
  else { for (let i = norm(a, n - 1); i > (b === null ? -1 : norm(b, -1)); i += st) out.push(arr[i]); }
  return typeof s === 'string' ? out.join('') : out;
};

function act(a){

  render();tick();

window.addEventListener('hashchange',function(){if(view==='quiz'||view==='review')return;view=location.hash==='#storico'?'storico':location.hash==='#assistente'?'ai':'home';render();});
render();
})();
</script>
<script>
if('serviceWorker' in navigator&&location.protocol==='https:'){
  var avevaSW=!!navigator.serviceWorker.controller, ricaricata=false;
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      // ogni volta che l'app torna in primo piano controlla se c'e' una versione nuova
      document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')reg.update().catch(function(){});});
    }).catch(function(){});
  });
  // quando arriva la versione nuova ricarica la pagina, ma non durante una sessione di quiz
  navigator.serviceWorker.addEventListener('controllerchange',function(){
    if(avevaSW&&!ricaricata&&!document.querySelector('.dots')){ricaricata=true;location.reload();}
  });
}
</script>
